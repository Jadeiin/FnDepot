name: Native fnOS FPKs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fpk.yml'
      - 'apps/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'tests/**'
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: Application directory name (all builds every app)
        type: string
        default: all
      upstream_tag:
        description: Exact upstream tag (one app only). Leave empty for latest stable.
        type: string
      publish:
        description: Publish a GitHub Release and update the Moo source
        type: boolean
        default: false
      signing:
        description: FPK signing mode when publishing
        type: choice
        options: [signed, unsigned]
        default: signed

permissions:
  actions: read
  contents: write

jobs:
  discover:
    name: Discover applications
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      publish_mode: ${{ steps.apps.outputs.publish_mode }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find configured applications
        id: apps
        env:
          SELECTED_APP: ${{ inputs.app || 'all' }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          PUBLISH:
            ${{ (github.event_name == 'schedule' && vars.FNPACK_PUBLISH) ||
                (github.event_name == 'workflow_dispatch' && inputs.publish && (inputs.signing || 'signed')) }}
        shell: bash
        run: |
          if [[ "$SELECTED_APP" == all && -n "$UPSTREAM_TAG" ]]; then
            echo '::error::Select one app when specifying an upstream tag.'
            exit 1
          fi
          apps=$(python3 scripts/fpk.py list --json -- "$SELECTED_APP")
          case "$PUBLISH" in
            true|signed) publish_mode=signed ;;
            unsigned) publish_mode=unsigned ;;
            *) publish_mode=debug ;;
          esac
          {
            echo "apps=$apps"
            echo "publish_mode=$publish_mode"
          } >> "$GITHUB_OUTPUT"

      - name: Test release and package logic
        run: python3 -m unittest discover -s tests

  package:
    name: Package ${{ matrix.app }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    concurrency:
      group: native-fpk-${{ matrix.app }}
      cancel-in-progress: false
    env:
      APP: ${{ matrix.app }}
      PUBLISH_MODE: ${{ needs.discover.outputs.publish_mode }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve upstream and check for existing output
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          CAN_SIGN: ${{ secrets.FNPACK_SIGNING_KEY != '' && secrets.FNPACK_SIGNING_CERT != '' }}
        shell: bash
        run: |
          if [[ "$PUBLISH_MODE" == signed && "$CAN_SIGN" != true ]]; then
            echo '::error::Signed publishing requires FNPACK_SIGNING_KEY and FNPACK_SIGNING_CERT.'
            exit 1
          fi

          python3 scripts/fpk.py resolve "$APP" --tag "$UPSTREAM_TAG" > "$RUNNER_TEMP/upstream.json"
          tag=$(jq -r '.release_tag' "$RUNNER_TEMP/upstream.json")
          artifact="fpk-${tag}-${GITHUB_SHA}"
          if [[ "$PUBLISH_MODE" != debug ]]; then
            if state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null) && [[ "$state" == false ]]; then
              echo "$tag is already published."
              exit 0
            fi
            artifact+="-$PUBLISH_MODE"
          else
            digest=$(sha256sum "$RUNNER_TEMP/upstream.json" | cut -c1-12)
            artifact+="-${digest}-debug"
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
              existing=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
                -f name="$artifact" --jq '[.artifacts[] | select(.expired == false)] | length')
              if [[ "$existing" -gt 0 ]]; then
                echo "An unexpired artifact already exists for $tag and this build plan."
                exit 0
              fi
            fi
          fi
          {
            echo "artifact=$artifact"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build FPKs
        if: steps.plan.outputs.tag != ''
        env:
          SIGNING_KEY: ${{ env.PUBLISH_MODE == 'signed' && secrets.FNPACK_SIGNING_KEY || '' }}
          SIGNING_CERT: ${{ env.PUBLISH_MODE == 'signed' && secrets.FNPACK_SIGNING_CERT || '' }}
        shell: bash
        run: |
          build_options=()
          if [[ "$PUBLISH_MODE" == unsigned ]]; then
            build_options=(--community)
          elif [[ "$PUBLISH_MODE" == signed ]]; then
            signing_dir=$(mktemp -d)
            trap 'rm -rf "$signing_dir"' EXIT
            (
              umask 077
              printf '%s\n' "$SIGNING_KEY" > "$signing_dir/developer.key"
              printf '%s\n' "$SIGNING_CERT" > "$signing_dir/developer.crt"
            )
            unset SIGNING_KEY SIGNING_CERT
            build_options=(--key "$signing_dir/developer.key" --cert "$signing_dir/developer.crt")
          fi
          python3 scripts/fpk.py build "$RUNNER_TEMP/upstream.json" --out dist "${build_options[@]}"
          cd dist
          sha256sum --check --strict SHA256SUMS

      - name: Upload FPKs and checksums
        if: steps.plan.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: |
            dist/*.fpk
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish FPKs
        if: steps.plan.outputs.tag != '' && env.PUBLISH_MODE != 'debug'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        shell: bash
        run: |
          source_url=$(jq -r '.source_url' "$RUNNER_TEMP/upstream.json")
          version=$(jq -r '.version' "$RUNNER_TEMP/upstream.json")
          notes=$(printf 'Native fnOS FPKs.\n\nUpstream source: %s\n\nFPK version: %s\n\nFPK signing: %s' \
            "$source_url" "$version" "$PUBLISH_MODE")
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$state" == true ]]; then
              gh release upload "$RELEASE_TAG" dist/*.fpk dist/SHA256SUMS --clobber
              gh release edit "$RELEASE_TAG" --notes "$notes" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" dist/*.fpk dist/SHA256SUMS \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "$notes"
          fi

  sync-source:
    name: Update the Moo source
    needs: [discover, package]
    if: >-
      ${{ !cancelled() && needs.discover.result == 'success' &&
          needs.discover.outputs.publish_mode != 'debug' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: native-fpk-source
      cancel-in-progress: false
    env:
      SOURCE_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Regenerate and publish fnpack.json
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq 'add // []' > "$RUNNER_TEMP/fndepot-releases.json"
            python3 -m scripts.fnpack_index "$GITHUB_REPOSITORY" "$RUNNER_TEMP/fndepot-releases.json"
            if git diff --quiet -- fnpack.json; then
              exit 0
            fi

            base=$(git rev-parse HEAD)
            git add -- fnpack.json
            git commit -m "Update fnOS application source"
            if git push origin "HEAD:refs/heads/$SOURCE_BRANCH"; then
              exit 0
            fi

            git fetch origin "$SOURCE_BRANCH"
            if [[ "$attempt" == 3 || "$base" == "$(git rev-parse FETCH_HEAD)" ]]; then
              exit 1
            fi
            git reset --hard FETCH_HEAD
          done
